name: Deploy to GitHub Pages

# Publishing source: GitHub Actions (Settings → Pages → Build and deployment → Source = "GitHub Actions").
# The site is built from the Astro project in ./site and deployed as a Pages artifact — no gh-pages branch is used.

on:
  # Deploy when the site (or this workflow) changes on the default branch.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Permissions required to create a GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel an in-progress production deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          path: ./site
          node-version: 22
        # Uncomment to publish under a custom domain (and add site/public/CNAME):
        # env:
        #   SITE_URL: 'https://copilot-extensibility.example.com'
        #   BASE_PATH: '/'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
